{% extends 'base.html' %}

{% block content %}
<div class="card mx-auto shadow-sm" style="max-width: 600px;">
    <div class="card-header bg-dark text-white">
        <h4 class="mb-0">{{ action }} Пісню</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Назва пісні</label>
                <input type="text" name="title" class="form-control" value="{{ song.title if song else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Виконавець</label>
                <input type="text" name="artist" class="form-control" value="{{ song.artist if song else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Жанр</label>
                <input type="text" name="genre" class="form-control" value="{{ song.genre if song else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Ціна ($)</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ song.price if song else '' }}" required>
            </div>
            <button type="submit" class="btn btn-success">Зберегти</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
